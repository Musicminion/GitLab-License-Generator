<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="med" x1="90" y1="66" x2="166" y2="142" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff86b6"/>
      <stop offset="1" stop-color="#ff3d86"/>
    </linearGradient>
  </defs>

  <!-- award ribbon tails (behind) -->
  <polygon points="112,128 134,137 127,208 113.5,192 100,199" fill="#ff5c9e"/>
  <polygon points="144,128 122,137 129,208 142.5,192 156,199" fill="#e0327c"/>

  <!-- faceted rosette seal — alternating light/dark facets, GitLab style -->
  <g>
    <polygon points="117.1,63.4 128,32 138.9,63.4"     fill="#ff96c2"/>
    <polygon points="138.9,63.4 164,41.7 157.7,74.3"   fill="#ff3d86"/>
    <polygon points="157.7,74.3 190.4,68 168.6,93.1"   fill="#ff96c2"/>
    <polygon points="168.6,93.1 200,104 168.6,114.9"   fill="#ff3d86"/>
    <polygon points="168.6,114.9 190.4,140 157.7,133.7" fill="#ff96c2"/>
    <polygon points="157.7,133.7 164,166.4 138.9,144.6" fill="#ff3d86"/>
    <polygon points="138.9,144.6 128,176 117.1,144.6"  fill="#ff96c2"/>
    <polygon points="117.1,144.6 92,166.4 98.3,133.7"  fill="#ff3d86"/>
    <polygon points="98.3,133.7 65.6,140 87.4,114.9"   fill="#ff96c2"/>
    <polygon points="87.4,114.9 56,104 87.4,93.1"      fill="#ff3d86"/>
    <polygon points="87.4,93.1 65.6,68 98.3,74.3"      fill="#ff96c2"/>
    <polygon points="98.3,74.3 92,41.7 117.1,63.4"     fill="#ff3d86"/>
  </g>

  <!-- medallion -->
  <circle cx="128" cy="104" r="44" fill="url(#med)" stroke="#ffffff" stroke-width="4"/>

  <!-- "licensed" checkmark -->
  <path d="M108 105 L123 120 L151 86" stroke="#ffffff" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
